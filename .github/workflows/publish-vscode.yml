name: Publish TDF & TBF Extension

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace tests
        run: pnpm test

      - name: Build extension
        run: pnpm --filter tdf-language-support build

      - name: Validate release files
        working-directory: packages/vscode
        run: pnpm run release:check

      - name: Package VSIX
        working-directory: packages/vscode
        run: pnpm dlx @vscode/vsce@4.0.2 package

      - name: Verify VSIX
        working-directory: packages/vscode
        run: pnpm run vsix:verify

      - name: Publish to VS Code Marketplace
        working-directory: packages/vscode
        run: pnpm dlx @vscode/vsce@4.0.2 publish --oidc