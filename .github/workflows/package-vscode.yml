name: Package VS Code Extension

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and Package VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build workspace
        run: pnpm build

      - name: Validate release
        working-directory: packages/vscode
        run: pnpm run release:check

      - name: Package VSIX
        working-directory: packages/vscode
        run: pnpm dlx @vscode/vsce@4.1.0 package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: tdf-language-support-v1.0.0
          path: packages/vscode/*.vsix
          if-no-files-found: error
          retention-days: 14
